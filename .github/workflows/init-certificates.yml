name: Initialize Certificates

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Fastlane
        run: gem install fastlane

      - name: Run Fastlane Init Certificates
        run: fastlane ios init_certificates
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}

      - name: Export .p12 from Keychain
        run: |
          mkdir -p build/certs
          security export -k ~/Library/Keychains/login.keychain-db -t identities -f pkcs12 -o build/certs/certificate.p12 -P ""

      - name: Upload Certificate Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-certificates
          path: build/certs/certificate.p12
          retention-days: 30
